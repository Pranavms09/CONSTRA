services:
  - type: web
    name: constra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
