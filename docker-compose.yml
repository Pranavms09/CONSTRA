version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siteverify-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./siteverify.db
      - FRONTEND_ORIGIN=*
      - GEMINI_MODEL=gemini-2.5-flash
      - UPLOAD_DIR=./uploads
      - MAX_UPLOAD_MB=15
      - OCR_MODE=real
    env_file:
      - ./backend/.env
    volumes:
      # Persistent shared database and uploaded files across laptop reboots
      - backend_data:/app/uploads
      - backend_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: siteverify-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_db:
